services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: chessbox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: chessbox
    ports:
      - "5432:5432"
    volumes:
      - /mnt/ssd/chessbox-postgres:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://chessbox:${POSTGRES_PASSWORD}@postgres:5432/chessbox
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - postgres
